<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600' viewBox='0 0 800 600'>
  <rect width='100%' height='100%' fill='#0b0d14'/>
  <defs>
    <linearGradient id='bgGrad1' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#101424'/>
      <stop offset='100%' stop-color='#07090e'/>
    </linearGradient>
    <linearGradient id='nodeGlow' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#00f0ff'/>
      <stop offset='100%' stop-color='#3b82f6'/>
    </linearGradient>
  </defs>
  <rect width='100%' height='100%' fill='url(#bgGrad1)'/>
  
  <!-- Network Grid Background -->
  <path d='M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800' stroke='rgba(255,255,255,0.04)' stroke-width='1'/>
  <path d='M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600' stroke='rgba(255,255,255,0.04)' stroke-width='1'/>

  <!-- Terminal Window -->
  <rect x='100' y='120' width='600' height='360' rx='16' fill='#121626' stroke='rgba(0, 240, 255, 0.3)' stroke-width='1.5'/>
  <circle cx='130' cy='145' r='6' fill='#ef4444'/>
  <circle cx='150' cy='145' r='6' fill='#f59e0b'/>
  <circle cx='170' cy='145' r='6' fill='#10b981'/>
  <text x='200' y='150' font-family='monospace' font-size='14' fill='rgba(255,255,255,0.5)'>api_server_postgres.py — Python 3.11</text>

  <!-- Terminal Code Stream -->
  <text x='130' y='195' font-family='monospace' font-size='15' fill='#3b82f6'>async def <tspan fill='#00f0ff'>process_ai_task_queue</tspan>(db: Session):</text>
  <text x='150' y='225' font-family='monospace' font-size='14' fill='rgba(255,255,255,0.7)'>query = select(Task).where(Task.status == <tspan fill='#10b981'>'PENDING'</tspan>)</text>
  <text x='150' y='255' font-family='monospace' font-size='14' fill='rgba(255,255,255,0.7)'>result = await db.execute(query)</text>
  <text x='150' y='285' font-family='monospace' font-size='14' fill='#ff4d00'># Vector embedding & async Postgres commit</text>
  <text x='150' y='315' font-family='monospace' font-size='14' fill='rgba(255,255,255,0.7)'>await db.commit()</text>

  <!-- Node Status Cards -->
  <rect x='130' y='360' width='160' height='80' rx='10' fill='rgba(0,240,255,0.08)' stroke='#00f0ff' stroke-width='1'/>
  <text x='150' y='390' font-family='monospace' font-size='12' fill='#00f0ff'>POSTGRES DB</text>
  <text x='150' y='415' font-family='monospace' font-size='18' fill='#ffffff' font-weight='bold'>2,450 req/s</text>

  <rect x='320' y='360' width='160' height='80' rx='10' fill='rgba(59,130,246,0.08)' stroke='#3b82f6' stroke-width='1'/>
  <text x='340' y='390' font-family='monospace' font-size='12' fill='#3b82f6'>FASTAPI ASYNC</text>
  <text x='340' y='415' font-family='monospace' font-size='18' fill='#ffffff' font-weight='bold'>Latency: 4ms</text>

  <rect x='510' y='360' width='160' height='80' rx='10' fill='rgba(16,185,129,0.08)' stroke='#10b981' stroke-width='1'/>
  <text x='530' y='390' font-family='monospace' font-size='12' fill='#10b981'>STATUS</text>
  <text x='530' y='415' font-family='monospace' font-size='18' fill='#10b981' font-weight='bold'>ACTIVE 200</text>
</svg>